  <title>MapaElétrica Calc</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563EB'/%3E%3Cpath d='M18 4 8 18h7l-2 10 11-15h-7z' fill='white'/%3E%3C/svg%3E">
  <style>
/* MapaElétrica Calc | estilos */
:root {
  --navy: #10213A;
  --navy-2: #1B3358;
  --blue: #2563EB;
  --blue-700: #1D4ED8;
  --blue-50: #EEF3FE;
  --blue-100: #DCE6FD;
  --green: #16A34A;
  --green-700: #15803D;
  --green-50: #ECFDF3;
  --bg: #F7F9FC;
  --surface: #FFFFFF;
  --surface-2: #F3F6FB;
  --text: #0F1B2D;
  --muted: #64748B;
  --border: #E3E8F0;
  --border-2: #CBD5E1;
  --red: #DC2626;
  --red-700: #B91C1C;
  --red-50: #FEF2F2;
  --amber: #B45309;
  --amber-50: #FFF8EB;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(16, 33, 58, .06), 0 4px 16px rgba(16, 33, 58, .05);
  --shadow-lg: 0 8px 30px rgba(16, 33, 58, .12);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --topbar-h: 62px;
  --sidebar-w: 268px;
  --c-fund: #2563EB; --c-fund-bg: #EEF3FE;
  --c-res: #0E7490; --c-res-bg: #E7F6F9;
  --c-ca: #4F46E5; --c-ca-bg: #EFEFFE;
  --c-pot: #B45309; --c-pot-bg: #FEF5E6;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { color: var(--navy); line-height: 1.25; margin: 0; }
p { margin: 0; }
a { color: var(--blue); }
button, input, select { font: inherit; color: inherit; }
svg { display: block; }
[hidden] { display: none !important; }

:focus-visible { outline: 3px solid rgba(37, 99, 235, .45); outline-offset: 2px; border-radius: 6px; }

.skip {
  position: absolute; left: 12px; top: -60px; z-index: 100;
  background: var(--navy); color: #fff; padding: 10px 14px; border-radius: 8px; text-decoration: none;
}
.skip:focus { top: 10px; }

.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico-sm { width: 16px; height: 16px; }
.ico-lg { width: 26px; height: 26px; }

/* ---------------- Barra superior ---------------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  height: var(--topbar-h);
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px;
  background: var(--navy);
  color: #fff;
  box-shadow: 0 1px 0 rgba(255, 255, 255, .06);
}
.brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; min-width: 0; }
.brand-mark {
  width: 36px; height: 36px; border-radius: 10px; flex: none;
  display: grid; place-items: center;
  background: linear-gradient(140deg, #2F6BF0, #1D4ED8);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .18);
}
.brand-mark svg { width: 20px; height: 20px; fill: #fff; stroke: none; }
.brand-name { font-weight: 700; font-size: 18px; letter-spacing: -.01em; white-space: nowrap; }
.brand-name span { color: #8FB3FF; font-weight: 700; }
.brand-sub { display: block; font-size: 11.5px; color: #A9B8D0; font-weight: 500; letter-spacing: .01em; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.prec { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: #C8D4E8; }
.prec select {
  background: var(--navy-2); color: #fff; border: 1px solid rgba(255, 255, 255, .16);
  border-radius: 8px; padding: 6px 8px; font-size: 14px;
}
.icon-btn {
  display: inline-grid; place-items: center;
  width: 40px; height: 40px; border-radius: 10px;
  border: 0; background: transparent; color: inherit; cursor: pointer; text-decoration: none;
}
.topbar .icon-btn:hover { background: rgba(255, 255, 255, .08); }
.menu-btn { display: none; }

/* ---------------- Estrutura ---------------- */
.layout { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: calc(100vh - var(--topbar-h)); }
.sidebar {
  position: sticky; top: var(--topbar-h);
  height: calc(100vh - var(--topbar-h));
  overflow-y: auto;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 16px 12px 24px;
}
.nav-group { margin-bottom: 14px; }
.nav-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); padding: 8px 10px 6px;
}
.nav-title .dotc { width: 8px; height: 8px; border-radius: 50%; }
.nav-link {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 9px;
  color: var(--text); text-decoration: none; font-size: 14.5px;
}
.nav-link:hover { background: var(--surface-2); }
.nav-link[aria-current="page"] { background: var(--blue-50); color: var(--blue-700); font-weight: 600; }
.nav-num { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; width: 20px; flex: none; }
.nav-link[aria-current="page"] .nav-num { color: var(--blue); }
.nav-sep { height: 1px; background: var(--border); margin: 10px 8px 12px; }
.nav-fav .ico { color: #E0A100; }
.scrim { display: none; }

main { padding: 28px 32px 48px; min-width: 0; outline: none; }
.wrap { max-width: 1180px; margin: 0 auto; }

/* ---------------- Botões ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px;
  border-radius: 10px; border: 1px solid transparent;
  font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none;
  transition: background-color .15s, border-color .15s, color .15s;
}
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: var(--blue-700); }
.btn-soft { background: var(--blue-50); color: var(--blue-700); }
.btn-soft:hover { background: var(--blue-100); }
.btn-ghost { background: var(--surface); color: var(--navy); border-color: var(--border-2); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-small { min-height: 38px; padding: 0 12px; font-size: 14px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* ---------------- Cartões ---------------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.card-pad { padding: 22px; }
.section-title { display: flex; align-items: center; gap: 10px; font-size: 17px; margin-bottom: 16px; }
.section-title .tag {
  font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 2px 7px;
}

/* ---------------- Início ---------------- */
.hero {
  position: relative; overflow: hidden;
  border-radius: 18px;
  padding: 34px 36px;
  background: linear-gradient(135deg, #10213A 0%, #16305A 60%, #1E3F78 100%);
  color: #fff;
  display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 28px; align-items: center;
}
.hero::after {
  content: ""; position: absolute; right: -60px; top: -60px; width: 280px; height: 280px; border-radius: 50%;
  background: radial-gradient(circle, rgba(59, 130, 246, .35), transparent 70%);
  pointer-events: none;
}
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #8FB3FF; margin-bottom: 10px; }
.hero h1 { color: #fff; font-size: clamp(24px, 3.2vw, 34px); letter-spacing: -.02em; }
.hero .lead { color: #C9D6EA; margin-top: 12px; font-size: 16.5px; max-width: 620px; }
.hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; position: relative; z-index: 1; }
.stat { background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .12); border-radius: 12px; padding: 14px 12px; text-align: center; }
.stat strong { display: block; font-size: 24px; color: #fff; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: #B8C7DF; }

.finder { margin: 22px 0 8px; display: grid; gap: 14px; }
.search { position: relative; }
.search .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input {
  width: 100%; min-height: 50px; padding: 0 16px 0 44px;
  border: 1px solid var(--border-2); border-radius: 12px; background: var(--surface);
  font-size: 16px;
}
.search input:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px rgba(37, 99, 235, .18); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 38px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--border-2); background: var(--surface); color: var(--navy);
  font-size: 14px; font-weight: 500; cursor: pointer;
}
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.chip .ico { width: 16px; height: 16px; }

.cat-block { margin-top: 26px; }
.cat-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.cat-head h2 { font-size: 18px; }
.cat-head .count { font-size: 13px; color: var(--muted); }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.tool-card { padding: 18px; display: flex; flex-direction: column; gap: 6px; transition: box-shadow .15s, border-color .15s; }
.tool-card:hover { box-shadow: var(--shadow-lg); border-color: var(--blue-100); }
.tool-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 6px; }
.tool-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }
.tool-icon .ico { width: 24px; height: 24px; }
.cat-fund { color: var(--c-fund); background: var(--c-fund-bg); }
.cat-res { color: var(--c-res); background: var(--c-res-bg); }
.cat-ca { color: var(--c-ca); background: var(--c-ca-bg); }
.cat-pot { color: var(--c-pot); background: var(--c-pot-bg); }
.dot-fund { background: var(--c-fund); } .dot-res { background: var(--c-res); } .dot-ca { background: var(--c-ca); } .dot-pot { background: var(--c-pot); }
.tool-num { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.tool-card h3 { font-size: 17px; }
.tool-desc { color: var(--muted); font-size: 14.5px; flex: 1; margin-bottom: 10px; }
.star {
  width: 38px; height: 38px; border-radius: 10px; border: 0; background: transparent; cursor: pointer;
  display: grid; place-items: center; color: #9AA8BD;
}
.star:hover { background: var(--surface-2); color: #C98F00; }
.star[aria-pressed="true"] { color: #E0A100; }
.star[aria-pressed="true"] .ico { fill: #F5B800; stroke: #E0A100; }
.empty-search { padding: 40px 20px; text-align: center; color: var(--muted); }

.disclaimer-box {
  margin-top: 30px; display: flex; gap: 12px; align-items: flex-start;
  padding: 16px 18px; border-radius: 12px; background: var(--surface); border: 1px dashed var(--border-2);
  color: var(--muted); font-size: 14px;
}
.disclaimer-box .ico { color: var(--blue); margin-top: 2px; }

/* ---------------- Calculadora ---------------- */
.calc-head { padding: 22px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: start; }
.calc-head .tool-icon { width: 54px; height: 54px; border-radius: 14px; }
.calc-head .tool-icon .ico { width: 28px; height: 28px; }
.kicker { font-size: 12.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.calc-head h1 { font-size: clamp(22px, 2.6vw, 28px); letter-spacing: -.015em; margin: 2px 0 6px; outline: none; }
.objective { color: var(--text); }
.guidance { color: var(--muted); font-size: 14.5px; margin-top: 6px; }
.crumbs { font-size: 14px; margin-bottom: 12px; }
.crumbs a { text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }

.calc-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 18px; margin-top: 18px; align-items: start; }
.inputs-card { padding: 22px; }
.result-card { padding: 22px; position: sticky; top: calc(var(--topbar-h) + 16px); }

.field { margin-bottom: 16px; }
.field > label, .field-label { display: flex; align-items: baseline; gap: 6px; font-weight: 600; color: var(--navy); font-size: 14.5px; margin-bottom: 6px; }
.sym { font-family: var(--mono); font-size: 13px; color: var(--blue-700); background: var(--blue-50); padding: 0 6px; border-radius: 5px; font-weight: 600; }
.input-group {
  display: flex; align-items: stretch;
  border: 1px solid var(--border-2); border-radius: 10px; background: var(--surface);
  transition: border-color .15s, box-shadow .15s;
}
.input-group:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37, 99, 235, .16); }
.input-group input {
  flex: 1; min-width: 0; min-height: 48px; padding: 0 14px;
  border: 0; background: transparent; font-size: 17px; font-variant-numeric: tabular-nums;
  border-radius: 10px;
}
.input-group input:focus { outline: none; }
.input-group input[readonly] { color: var(--muted); }
.input-group select, .unit-fixed {
  flex: none; min-width: 74px; border: 0; border-left: 1px solid var(--border);
  background: var(--surface-2); padding: 0 10px; font-size: 15px; font-weight: 600; color: var(--navy);
  border-radius: 0 10px 10px 0; cursor: pointer;
}
.unit-fixed { display: grid; place-items: center; cursor: default; font-weight: 600; color: var(--muted); }
.select-full {
  width: 100%; min-height: 48px; padding: 0 12px;
  border: 1px solid var(--border-2); border-radius: 10px; background: var(--surface); font-size: 16px;
}
.select-full:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px rgba(37, 99, 235, .16); }
.hint { font-size: 13px; color: var(--muted); margin-top: 5px; }
.err { font-size: 13.5px; color: var(--red-700); margin-top: 6px; display: flex; gap: 6px; }
.err:empty { display: none; }
.field.invalid .input-group, .field.invalid .select-full { border-color: var(--red); box-shadow: 0 0 0 3px rgba(220, 38, 38, .1); }

.seg { border: 0; padding: 0; margin: 0 0 16px; min-width: 0; }
.seg legend { font-weight: 600; color: var(--navy); font-size: 14.5px; margin-bottom: 6px; padding: 0; }
.seg-opts { display: flex; flex-wrap: wrap; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 12px; border: 1px solid var(--border); }
.seg-opts label { flex: 1 1 auto; position: relative; }
.seg-opts input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.seg-opts span {
  display: flex; align-items: center; justify-content: center; text-align: center;
  min-height: 40px; padding: 4px 12px; border-radius: 9px;
  font-size: 14.5px; font-weight: 500; color: var(--navy);
}
.seg-opts input:checked + span { background: var(--surface); color: var(--blue-700); font-weight: 650; box-shadow: 0 1px 3px rgba(16, 33, 58, .12); }
.seg-opts input:focus-visible + span { outline: 3px solid rgba(37, 99, 235, .45); outline-offset: 1px; }

.form-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; padding-top: 16px; border-top: 1px solid var(--border); }
.form-actions .btn-primary { flex: 1 1 160px; }

.swap-row { display: flex; justify-content: center; margin: -6px 0 10px; }

/* Lista de resistores */
.rlist { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 10px; }
.rrow { display: grid; grid-template-columns: 38px minmax(0, 1fr) 40px; gap: 8px; align-items: center; }
.rrow > label { font-weight: 700; color: var(--navy); font-family: var(--mono); font-size: 14px; }
.rrow .err { grid-column: 2 / 4; margin-top: -4px; }
.rrow.invalid .input-group { border-color: var(--red); }
.rrow .icon-btn { color: var(--muted); border: 1px solid var(--border); }
.rrow .icon-btn:hover:not([disabled]) { color: var(--red-700); background: var(--red-50); }
.rrow .icon-btn[disabled] { opacity: .35; cursor: not-allowed; }
.list-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 14.5px; font-weight: 600; color: var(--navy); }
.list-meta span { color: var(--muted); font-weight: 500; font-size: 13px; }

/* Resultado */
.result-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.result-head .section-title { margin: 0; }
.live {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;
  color: var(--green-700); background: var(--green-50); border-radius: 999px; padding: 4px 10px;
}
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
.res-empty {
  display: grid; justify-items: center; gap: 10px; text-align: center;
  padding: 34px 18px; border-radius: 12px; background: var(--surface-2); color: var(--muted); border: 1px dashed var(--border-2);
}
.res-empty .ico { width: 34px; height: 34px; color: var(--blue); }
.res-error { background: var(--red-50); border: 1px solid #F8C9C9; border-radius: 12px; padding: 16px; color: var(--red-700); }
.res-error strong { display: flex; align-items: center; gap: 8px; color: var(--red-700); margin-bottom: 6px; }
.res-error ul { margin: 0; padding-left: 20px; }
.res-error li { margin: 3px 0; }
.res-primary { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.res-main {
  border-radius: 12px; padding: 14px 16px;
  background: linear-gradient(180deg, #F2FBF5, #E8F7EE); border: 1px solid #BFE8CD;
}
.res-label { display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: #276D43; font-weight: 600; }
.res-value { display: block; font-size: clamp(22px, 2.4vw, 28px); font-weight: 750; color: var(--navy); font-variant-numeric: tabular-nums; letter-spacing: -.01em; line-height: 1.2; margin-top: 4px; overflow-wrap: anywhere; }
.res-base { display: block; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
.equation { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--blue-50); color: var(--navy); font-weight: 650; font-variant-numeric: tabular-nums; font-size: 18px; }
.res-sub { margin-top: 16px; }
.res-sub h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
.res-list { margin: 0; display: grid; }
.res-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.res-row:last-child { border-bottom: 0; }
.res-row dt { color: var(--text); font-size: 14.5px; }
.res-row dt .sym { margin-left: 4px; }
.res-row dd { margin: 0; text-align: right; font-weight: 650; color: var(--navy); font-variant-numeric: tabular-nums; }
.res-row dd small { display: block; font-weight: 500; color: var(--muted); font-size: 12.5px; }
.alerts { display: grid; gap: 8px; margin-top: 14px; }
.alert { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; padding: 11px 13px; border-radius: 10px; background: var(--amber-50); color: #7A4A06; border: 1px solid #F4DDB2; }
.alert .ico { color: var(--amber); margin-top: 1px; }
.diagram { margin-top: 16px; border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: #FBFCFE; }
.diagram h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
.diagram svg { width: 100%; height: auto; max-height: 340px; }
.dg-legend { margin: 8px 0 0; padding-left: 18px; font-size: 13.5px; color: var(--text); font-variant-numeric: tabular-nums; }
.res-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }

/* SVG dos diagramas */
.dg-w { stroke: var(--navy); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dg-res { stroke: var(--blue); stroke-width: 2.4; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.dg-c { stroke: var(--navy); stroke-width: 2.4; fill: #fff; }
.dg-t { fill: var(--navy); font-size: 13px; font-weight: 700; font-family: var(--font); }
.dg-v { fill: var(--blue-700); font-size: 12.5px; font-weight: 600; font-family: var(--font); }
.dg-m { fill: var(--muted); font-size: 13px; font-weight: 700; font-family: var(--font); }
.dg-sym { fill: var(--navy); font-size: 15px; font-weight: 700; font-family: var(--font); }
.dg-dot { fill: var(--navy); }
.dg-term { fill: #fff; stroke: var(--navy); stroke-width: 2; }
.dg-arrow { fill: var(--green); }
.dg-arrow2 { fill: var(--navy); }
.dg-axis { stroke: var(--border-2); stroke-width: 1.5; }
.dg-wave { stroke: var(--blue); stroke-width: 2.6; fill: none; }
.dg-wave2 { stroke: var(--blue); stroke-width: 2; fill: none; stroke-dasharray: 4 4; opacity: .5; }
.dg-fill { fill: rgba(37, 99, 235, .07); stroke: none; }
.dg-leg-a { stroke: var(--blue); stroke-width: 3; stroke-linecap: round; }
.dg-leg-b { stroke: var(--green); stroke-width: 3; stroke-linecap: round; }
.dg-leg-c { stroke: var(--navy); stroke-width: 3; stroke-linecap: round; }
.dg-thin { stroke: var(--muted); stroke-width: 1.5; fill: none; }
.dg-box { fill: #fff; stroke: var(--blue); stroke-width: 2.2; }
.dg-boxt { fill: var(--blue-700); font-size: 11px; font-weight: 700; }

/* Memória e explicação */
.lower { display: grid; gap: 18px; margin-top: 18px; }
.muted-box { color: var(--muted); font-size: 14.5px; padding: 6px 0; }
.inputs-used { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); font-size: 14px; font-variant-numeric: tabular-nums; }
.pill b { color: var(--navy); }
.pill small { color: var(--muted); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: step; }
.step { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; background: #FCFDFF; }
.step h3 { font-size: 15px; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.step h3::before {
  counter-increment: step; content: counter(step);
  width: 24px; height: 24px; border-radius: 50%; background: var(--navy); color: #fff;
  font-size: 12.5px; display: grid; place-items: center; flex: none;
}
.f-row { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 4px 0; }
.f-tag { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.f { font-family: var(--mono); font-size: 15px; color: var(--navy); overflow-wrap: anywhere; }
.f-res { color: var(--green-700); font-weight: 700; }
.f-lines { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.explain p + p { margin-top: 10px; }
.explain h3 { font-size: 14px; margin: 18px 0 8px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.explain ul { margin: 0; padding-left: 20px; }
.explain li { margin: 4px 0; }
.formula-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.formula-chips code { font-family: var(--mono); font-size: 14px; background: var(--blue-50); color: var(--navy); padding: 5px 10px; border-radius: 8px; }
.note-edu { margin-top: 16px; font-size: 13.5px; color: var(--muted); display: flex; gap: 8px; }
.note-edu .ico { color: var(--blue); }

/* Histórico e páginas */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head h1 { font-size: 26px; outline: none; }
.page-head p { color: var(--muted); margin-top: 4px; }
.hist-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.hist-item { padding: 16px 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.hist-item h3 { font-size: 16px; }
.hist-meta { font-size: 13px; color: var(--muted); }
.hist-data { font-size: 14px; color: var(--text); margin-top: 4px; overflow-wrap: anywhere; }
.hist-res { font-size: 14.5px; font-weight: 650; color: var(--green-700); margin-top: 2px; overflow-wrap: anywhere; }
.hist-actions { display: flex; gap: 6px; }
.notice { padding: 14px 16px; border-radius: 12px; background: var(--amber-50); border: 1px solid #F4DDB2; color: #7A4A06; font-size: 14.5px; margin-bottom: 14px; }
.prose { max-width: 760px; }
.prose h2 { font-size: 18px; margin: 24px 0 8px; }
.prose p, .prose li { color: var(--text); }
.prose p + p { margin-top: 10px; }
.prose ul, .prose ol { padding-left: 22px; }

.site-foot { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; }

/* Aviso flutuante */
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
  background: var(--navy); color: #fff; padding: 12px 18px; border-radius: 12px; box-shadow: var(--shadow-lg);
  font-size: 14.5px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 80; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.modal-back { position: fixed; inset: 0; background: rgba(16, 33, 58, .45); display: grid; place-items: center; z-index: 90; padding: 16px; }
.modal { background: var(--surface); border-radius: 14px; padding: 20px; width: min(640px, 100%); box-shadow: var(--shadow-lg); }
.modal h2 { font-size: 18px; margin-bottom: 8px; }
.modal textarea { width: 100%; height: 260px; margin: 10px 0; font-family: var(--mono); font-size: 13px; border: 1px solid var(--border-2); border-radius: 10px; padding: 10px; }

.print-area { display: none; }

/* ---------------- Responsivo ---------------- */
@media (max-width: 1100px) {
  .calc-grid { grid-template-columns: minmax(0, 1fr); }
  .result-card { position: static; }
}
@media (max-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: inline-grid; }
  .sidebar {
    position: fixed; top: var(--topbar-h); left: 0; bottom: 0; z-index: 40;
    width: min(86vw, 300px); height: auto;
    transform: translateX(-100%); transition: transform .2s ease; box-shadow: var(--shadow-lg);
    visibility: hidden;
  }
  .sidebar.open { transform: translateX(0); visibility: visible; }
  .scrim.show { display: block; position: fixed; inset: var(--topbar-h) 0 0 0; background: rgba(16, 33, 58, .4); z-index: 35; }
  main { padding: 20px 20px 40px; }
  .hero { grid-template-columns: minmax(0, 1fr); padding: 26px 22px; }
}
@media (max-width: 600px) {
  .topbar { padding: 0 8px 0 4px; gap: 6px; }
  .brand-sub { display: none; }
  .brand-name { font-size: 16.5px; }
  .prec-label { display: none; }
  main { padding: 16px 16px 36px; }
  .hero { padding: 22px 18px; border-radius: 16px; }
  .hero-stats { gap: 8px; }
  .stat { padding: 10px 6px; }
  .stat strong { font-size: 20px; }
  .card-pad, .inputs-card, .result-card { padding: 16px; }
  .calc-head { padding: 16px; grid-template-columns: auto minmax(0, 1fr); }
  .calc-head .star { grid-column: 2; grid-row: 1; justify-self: end; }
  .calc-head .tool-icon { width: 44px; height: 44px; }
  .calc-head .head-text { grid-column: 1 / -1; }
  .f-row { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .res-actions { grid-template-columns: minmax(0, 1fr); }
  .hist-item { grid-template-columns: minmax(0, 1fr); }
  .grid-cards { grid-template-columns: minmax(0, 1fr); }
}

/* ---------------- Impressão / PDF ---------------- */
@media print {
  @page { margin: 16mm; }
  body { background: #fff; }
  body > *:not(.print-area) { display: none !important; }
  .print-area { display: block !important; color: #000; font-size: 11.5pt; }
  .print-area h1 { font-size: 18pt; margin: 6pt 0 2pt; color: #10213A; }
  .print-area h2 { font-size: 12.5pt; margin: 14pt 0 6pt; color: #10213A; border-bottom: 1px solid #ccd; padding-bottom: 3pt; break-after: avoid; page-break-after: avoid; }
  .print-area table { width: 100%; border-collapse: collapse; }
  .print-area td, .print-area th { text-align: left; padding: 4pt 6pt; border-bottom: 1px solid #e3e6ee; vertical-align: top; }
  .print-area td.v { text-align: right; font-weight: 700; white-space: nowrap; }
  .print-area .p-head { display: flex; justify-content: space-between; border-bottom: 2px solid #10213A; padding-bottom: 6pt; }
  .print-area .p-step { margin: 0 0 8pt; break-inside: avoid; }
  .print-area .p-step code { font-family: var(--mono); }
  .print-area .p-diagram { max-width: 360pt; margin: 6pt 0; break-inside: avoid; }
  .print-area .p-diagram svg { width: 100%; height: auto; }
  .print-area .p-disc { margin-top: 16pt; font-size: 9.5pt; color: #444; border-top: 1px solid #ccd; padding-top: 6pt; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

      var primary = [];
      var expl = [];

      if (hasL) steps.push({ title: 'Reatância indutiva', formula: 'XL = 2 × π × f × L', subst: 'XL = 2 × π × ' + H.u(f, 'Hz') + ' × ' + H.u(x.L, 'H'), result: 'XL = ' + H.q(xl, OHM) });
      else steps.push({ title: 'Reatância indutiva', lines: ['XL = 0 (o circuito RC não tem indutor)'] });
      if (hasC) steps.push({ title: 'Reatância capacitiva', formula: 'XC = 1 / (2 × π × f × C)', subst: 'XC = 1 / (2 × π × ' + H.u(f, 'Hz') + ' × ' + H.u(x.C, 'F') + ')', result: 'XC = ' + H.q(xc, OHM) });
      else steps.push({ title: 'Reatância capacitiva', lines: ['XC = 0 (o circuito RL não tem capacitor)'] });
      steps.push({ title: 'Reatância líquida', formula: 'X = XL − XC', subst: 'X = ' + H.u(xl, OHM) + ' − ' + H.u(xc, OHM), result: 'X = ' + H.u(X, OHM) });
      var zc = H.n(r) + (X < 0 ? ' − j' : ' + j') + H.n(Math.abs(X)) + ' ' + OHM;
      steps.push({ title: 'Impedância complexa', formula: 'Z = R + jX', subst: 'Z = ' + H.n(r) + ' + j(' + H.n(X) + ')', result: 'Z = ' + zc });
      steps.push({ title: 'Módulo da impedância', formula: '|Z| = √(R² + X²)', subst: '|Z| = √(' + H.n(r) + '² + ' + H.n(Math.abs(X)) + '²)', result: '|Z| = ' + H.q(z, OHM) });

      results.push(textItem('Impedância complexa', 'Z', zc));
      results.push(item('Reatância indutiva', 'XL', xl, OHM), item('Reatância capacitiva', 'XC', xc, OHM), item('Reatância líquida', 'X', X, OHM));
      if (type === 'RLC') {
        var f0 = 1 / (2 * PI * Math.sqrt(x.L * x.C));
        results.push(item('Frequência de ressonância', 'f0', f0, 'Hz'));
      }

      if (z === 0) {
        primary.push(item('Módulo da impedância', '|Z|', 0, OHM));
        results.push(textItem('Ângulo de fase', 'φ', 'indeterminado'), textItem('Fator de potência', 'FP', 'indeterminado'));
        warnings.push('Com R = 0 e XL = XC, a impedância do modelo ideal vale zero: é um curto-circuito. O ângulo de fase e o fator de potência ficam indeterminados e a corrente não pode ser calculada (seria infinita no modelo ideal).');
        expl.push('O circuito está em ressonância e não tem resistência. Na prática, a resistência dos fios e do indutor limita a corrente, mas o modelo ideal não consegue dar um valor.');
        return { primary: primary, results: results, steps: steps, warnings: warnings, explanation: expl, diagram: null };
      }

      var phi = Math.atan2(X, r) * 180 / PI;
      var fp = r / z;
      var behavior;
      if (X > 0) behavior = 'Predominantemente indutivo';
      else if (X < 0) behavior = 'Predominantemente capacitivo';
      else behavior = 'Resistivo';
      steps.push({ title: 'Ângulo de fase', formula: 'φ = atan2(X, R)', subst: 'φ = atan2(' + H.n(X) + ', ' + H.n(r) + ')', result: 'φ = ' + H.deg(phi) });
      steps.push({ title: 'Fator de potência', formula: 'FP = R / |Z| = cos φ', subst: 'FP = ' + H.n(r) + ' / ' + H.n(z), result: 'FP = ' + H.n(fp) });
      primary.push(item('Módulo da impedância', '|Z|', z, OHM), item('Ângulo de fase', 'φ', phi, '°'));
      results.splice(1, 0, textItem('Comportamento', '', behavior), item('Fator de potência', 'FP', fp, ''));

      if (X > 0) expl.push('XL é maior que XC, então o circuito é predominantemente indutivo: a corrente fica atrasada ' + H.deg(Math.abs(phi)) + ' em relação à tensão.');
      else if (X < 0) expl.push('XC é maior que XL, então o circuito é predominantemente capacitivo: a corrente fica adiantada ' + H.deg(Math.abs(phi)) + ' em relação à tensão.');
      else expl.push(type === 'RLC' ? 'XL e XC se cancelam: o circuito está em ressonância e se comporta como uma resistência pura (φ = 0°).' : 'Sem reatância líquida, o circuito se comporta como uma resistência pura.');
      if (r === 0) {
        warnings.push('Sem resistência, o circuito é puramente reativo: o fator de potência é 0 e não há consumo de potência ativa.');
      }
      expl.push('O fator de potência ' + H.n(fp) + ' indica a fração da potência aparente que vira potência ativa.');

      if (x.V !== null && x.V !== undefined) {
        var vrms = x.V;
        var i = vrms / z;
        var vr = i * r, vl = i * xl, vc = i * xc;
        steps.push({ title: 'Corrente RMS', formula: 'I = V / |Z|', subst: 'I = ' + H.u(vrms, 'V') + ' / ' + H.u(z, OHM), result: 'I = ' + H.q(i, 'A') });
        var lines = ['VR = I × R = ' + H.q(vr, 'V')];
        if (hasL) lines.push('VL = I × XL = ' + H.q(vl, 'V'));
        if (hasC) lines.push('VC = I × XC = ' + H.q(vc, 'V'));
        steps.push({ title: 'Tensões nos componentes (módulos)', lines: lines });
        var p = i * i * r, q = i * i * X, sa = vrms * i;
        steps.push({ title: 'Potências', lines: ['P = I² × R = ' + H.q(p, 'W'), 'Q = I² × X = ' + H.q(q, 'var', { sign: true }), 'S = V × I = ' + H.q(sa, 'VA')] });
        primary.push(item('Corrente RMS', 'I', i, 'A'));
        results.push(item('Tensão no resistor', 'VR', vr, 'V'));
        if (hasL) results.push(item('Tensão no indutor', 'VL', vl, 'V'));
        if (hasC) results.push(item('Tensão no capacitor', 'VC', vc, 'V'));
        results.push(item('Potência ativa', 'P', p, 'W'), item('Potência reativa', 'Q', q, 'var', { sign: true }), item('Potência aparente', 'S', sa, 'VA'));
        if (vl > vrms || vc > vrms) {
          expl.push('Repare que a tensão no indutor ou no capacitor pode passar da tensão da fonte. As duas estão defasadas 180° entre si e se cancelam em parte, então a soma vetorial continua igual a V.');
        }
      }
      return {
        primary: primary, results: results, steps: steps, warnings: warnings, explanation: expl,
        diagram: { kind: 'triangle', title: 'Triângulo de impedâncias', a: r, b: X, sym: { a: 'R', b: 'X', c: '|Z|' }, legend: ['R = ' + H.q(r, OHM) + ' (cateto horizontal)', 'X = ' + H.q(X, OHM) + (X >= 0 ? ' (para cima: indutivo)' : ' (para baixo: capacitivo)'), '|Z| = ' + H.q(z, OHM) + ' (hipotenusa)', 'φ = ' + H.deg(phi)] }
      };
    }
  };

  /* ---------------------------------------------------------------- */
  /* Natureza da carga (usado em 10 e 11)                              */
  /* ---------------------------------------------------------------- */
  var NATURE = [{ id: 'indutiva', label: 'Indutiva' }, { id: 'capacitiva', label: 'Capacitiva' }, { id: 'resistiva', label: 'Resistiva' }];

  function checkResistiveFP(x, s) {
    if (s.values.nature === 'resistiva' && Math.abs(x.FP - 1) > 1e-12) {
      var msg = 'Uma carga resistiva ideal tem fator de potência igual a 1. Use FP = 1 ou escolha carga indutiva ou capacitiva.';
      return { error: msg, fieldErrors: { FP: msg } };
    }
    return null;
  }

  function powerParts(sAp, fp, nature) {
    var sign = nature === 'capacitiva' ? -1 : 1;
    var qmag = sAp * Math.sqrt(Math.max(0, 1 - fp * fp));
    var q = nature === 'resistiva' ? 0 : sign * qmag;
    var phi = nature === 'resistiva' ? 0 : sign * Math.acos(fp) * 180 / PI;
    return { p: sAp * fp, q: q, phi: phi, qmag: qmag };
  }

  function powerNotes(fp, nature, H, pp) {
    var warnings = [];
    if (fp === 1 && nature !== 'resistiva') warnings.push('Com FP = 1 não há potência reativa: a carga se comporta como resistiva.');
    if (fp === 0) warnings.push('Com FP = 0 toda a potência é reativa: a carga não consome potência ativa.');
    return warnings;
  }

  /* ---------------------------------------------------------------- */
  /* 10 Potência monofásica                                            */
  /* ---------------------------------------------------------------- */
  var mono = {
    id: 'mono', num: 10, category: 'pot', icon: 'plug',
    name: 'Potência Monofásica',

    formulas: ['S = V × I', 'P = V × I × FP', '|Q| = S × √(1 − FP²)', '|φ| = arccos(FP)'],
    fields: [
      num('V', 'Tensão RMS', 'V', 'voltage', { constraint: 'nonnegative', noun: 'uma tensão' }),
      num('I', 'Corrente RMS', 'I', 'current', { constraint: 'nonnegative', noun: 'uma corrente' }),
      fixed('FP', 'Fator de potência', 'FP', '', { constraint: 'fp', hint: 'Número entre 0 e 1. Ex.: 0,8' }),

    ],
    solve: function (x, H, s) {
      var bad = checkResistiveFP(x, s);
      if (bad) return bad;
      var nature = s.values.nature;
      var sAp = x.V * x.I;
      var pp = powerParts(sAp, x.FP, nature);
      var steps = [
        { title: 'Potência aparente', formula: 'S = V × I', subst: 'S = ' + H.u(x.V, 'V') + ' × ' + H.u(x.I, 'A'), result: 'S = ' + H.q(sAp, 'VA') },
        { title: 'Potência ativa', formula: 'P = V × I × FP', subst: 'P = ' + H.u(x.V, 'V') + ' × ' + H.u(x.I, 'A') + ' × ' + H.n(x.FP), result: 'P = ' + H.q(pp.p, 'W') },
        { title: 'Potência reativa', formula: '|Q| = S × √(1 − FP²)', subst: '|Q| = ' + H.n(sAp) + ' × √(1 − ' + H.n(x.FP) + '²)',
          result: 'Q = ' + H.q(pp.q, 'var', { sign: true }) + ' (sinal ' + (pp.q < 0 ? 'negativo: carga capacitiva' : (pp.q > 0 ? 'positivo: carga indutiva' : 'nulo')) + ')' },
        { title: 'Ângulo de fase', formula: '|φ| = arccos(FP)', subst: '|φ| = arccos(' + H.n(x.FP) + ')', result: 'φ = ' + H.deg(pp.phi) },
        { title: 'Conferência', formula: 'S = √(P² + Q²)', subst: 'S = √(' + H.n(pp.p) + '² + ' + H.n(Math.abs(pp.q)) + '²)', result: 'S = ' + H.q(Math.hypot(pp.p, pp.q), 'VA') }
      ];
      return {
        primary: [item('Potência ativa', 'P', pp.p, 'W'), item('Potência aparente', 'S', sAp, 'VA'), item('Potência reativa', 'Q', pp.q, 'var', { sign: true })],
        results: [item('Ângulo de fase', 'φ', pp.phi, '°'), item('Fator de potência', 'FP', x.FP, ''), textItem('Natureza da carga', '', NATURE.filter(function (n) { return n.id === nature; })[0].label)],
        steps: steps, warnings: powerNotes(x.FP, nature, H, pp),
        explanation: [
          'A fonte entrega ' + H.q(sAp, 'VA') + ' de potência aparente. Desse total, ' + H.q(pp.p, 'W') + ' viram trabalho útil ou calor (potência ativa).',
          'Os ' + H.q(Math.abs(pp.q), 'var') + ' de potência reativa ficam indo e voltando entre a fonte e os campos elétricos ou magnéticos da carga. Eles não realizam trabalho, mas ocupam a capacidade dos cabos e transformadores.'
        ],
        diagram: { kind: 'triangle', title: 'Triângulo de potências', a: pp.p, b: pp.q, sym: { a: 'P', b: 'Q', c: 'S' }, legend: ['P = ' + H.q(pp.p, 'W') + ' (ativa)', 'Q = ' + H.q(pp.q, 'var', { sign: true }) + ' (reativa)', 'S = ' + H.q(sAp, 'VA') + ' (aparente)', 'φ = ' + H.deg(pp.phi)] }
      };
    }
  };

  /* ---------------------------------------------------------------- */
  /* 11 Potência trifásica equilibrada                                 */

  var tri = {

    fields: [

    example: { values: { VL: '380', IL: '10', FP: '0,8', conn: 'estrela', nature: 'indutiva' }, units: { VL: 'V', IL: 'A' } },
    assumptions: [

    ],
    solve: function (x, H, s) {
      var bad = checkResistiveFP(x, s);
      if (bad) return bad;
      var nature = s.values.nature;

      var sAp = SQRT3 * x.VL * x.IL;
      var pp = powerParts(sAp, x.FP, nature);
      var vf = star ? x.VL / SQRT3 : x.VL;
      var ifs = star ? x.IL : x.IL / SQRT3;
      var steps = [
        { title: 'Potência aparente', formula: 'S = √3 × VL × IL', subst: 'S = √3 × ' + H.u(x.VL, 'V') + ' × ' + H.u(x.IL, 'A'), result: 'S = ' + H.q(sAp, 'VA') },
        { title: 'Potência ativa', formula: 'P = √3 × VL × IL × FP', subst: 'P = √3 × ' + H.u(x.VL, 'V') + ' × ' + H.u(x.IL, 'A') + ' × ' + H.n(x.FP), result: 'P = ' + H.q(pp.p, 'W') + ' (' + H.n(pp.p) + ' W)' },
        { title: 'Potência reativa', formula: '|Q| = S × √(1 − FP²)', subst: '|Q| = ' + H.n(sAp) + ' × √(1 − ' + H.n(x.FP) + '²)', result: 'Q = ' + H.q(pp.q, 'var', { sign: true }) },
        star ? { title: 'Tensão de fase (estrela)', formula: 'Vfase = VL / √3', subst: 'Vfase = ' + H.u(x.VL, 'V') + ' / √3', result: 'Vfase = ' + H.q(vf, 'V') }
          : { title: 'Tensão de fase (triângulo)', formula: 'Vfase = VL', subst: 'Vfase = ' + H.u(x.VL, 'V'), result: 'Vfase = ' + H.q(vf, 'V') },
        star ? { title: 'Corrente de fase (estrela)', formula: 'Ifase = IL', subst: 'Ifase = ' + H.u(x.IL, 'A'), result: 'Ifase = ' + H.q(ifs, 'A') }
          : { title: 'Corrente de fase (triângulo)', formula: 'Ifase = IL / √3', subst: 'Ifase = ' + H.u(x.IL, 'A') + ' / √3', result: 'Ifase = ' + H.q(ifs, 'A') },
        { title: 'Potência ativa por fase', formula: 'Pfase = P / 3', subst: 'Pfase = ' + H.n(pp.p) + ' / 3', result: 'Pfase = ' + H.q(pp.p / 3, 'W') }
      ];
      var results = [
        item('Tensão de fase', 'Vfase', vf, 'V'), item('Corrente de fase', 'Ifase', ifs, 'A'),

        results.push(item('Impedância por fase', '|Zfase|', zf, OHM));

        primary: [item('Potência ativa', 'P', pp.p, 'W'), item('Potência aparente', 'S', sAp, 'VA'), item('Potência reativa', 'Q', pp.q, 'var', { sign: true })],
        results: results, steps: steps, warnings: powerNotes(x.FP, nature, H, pp),
        explanation: [

            : 'Na ligação triângulo, cada carga fica entre duas fases: recebe a tensão de linha inteira e é percorrida por IL/√3 = ' + H.q(ifs, 'A') + '.'
        ],
        diagram: { kind: star ? 'wye' : 'delta', VL: H.q(x.VL, 'V'), IL: H.q(x.IL, 'A'), Vf: H.q(vf, 'V'), If: H.q(ifs, 'A') }
      };
    }
  };

      ];

          x.dim === 'energy' ? 'Para energia, 1 Wh = 1 W durante 3.600 s = 3.600 J, e 1 kWh = 3.600.000 J.'
            : (x.dim === 'time' ? '1 min = 60 s e 1 h = 3.600 s.' : 'Mudar de unidade não muda a grandeza: só muda a escala usada para escrevê-la.')
        ]
      };
    }

          '</select><p class="err" id="e-' + f.id + '"></p></div>';
      }
      return '<fieldset class="seg field" data-field="' + f.id + '"' + hid + '><legend>' + esc(f.label) + '</legend><div class="seg-opts">' +
        f.options.map(function (o) {
          return '<label><input type="radio" name="' + fid + '" value="' + o.id + '" data-choice="' + f.id + '"' + (st.values[f.id] === o.id ? ' checked' : '') + '><span>' + esc(o.label) + '</span></label>';
        }).join('') + '</div><p class="err" id="e-' + f.id + '"></p></fieldset>';
    }
    if (f.type === 'unitpick') {
      var dim = st.values[f.dimFrom];
      var syms = U.DIMENSIONS[dim] ? U.unitSymbols(dim) : [];
      var html = '<div class="field" data-field="' + f.id + '"' + hid + '><label for="' + fid + '">' + esc(f.label) + '</label>' +
        '<select class="select-full" id="' + fid + '" data-unitpick="' + f.id + '">' +
        syms.map(function (s) {
          var u = U.findUnit(dim, s);
          return '<option value="' + esc(s) + '"' + (st.values[f.id] === s ? ' selected' : '') + '>' + esc(s) + ' (' + esc(u.name) + ')</option>';
        }).join('') + '</select><p class="err" id="e-' + f.id + '"></p></div>';
      if (calc.id === 'converter' && f.id === 'from') {
        html += '<div class="swap-row"><button type="button" class="btn btn-ghost btn-small" data-act="swap">' + icon('swap', 'ico-sm') + 'Inverter unidades</button></div>';
      }
      return html;
    }
    var unitPart = '';
    if (f.units) {
      unitPart = '<select data-unit="' + f.id + '" aria-label="Unidade de ' + esc(f.label) + '">' + unitOptions(f.units, st.units[f.id]) + '</select>';
    } else if (f.unit) {
      unitPart = '<span class="unit-fixed" aria-hidden="true">' + esc(f.unit) + '</span>';
    } else if (f.unitFrom) {
      unitPart = '<span class="unit-fixed" aria-hidden="true" data-unit-echo>' + esc(st.values[f.unitFrom] || '') + '</span>';
    }
    var desc = 'e-' + f.id + (f.hint ? ' h-' + f.id : '');
    return '<div class="field" data-field="' + f.id + '"' + hid + '>' +
      '<label for="' + fid + '">' + esc(f.label) + (f.symbol ? ' <span class="sym">' + esc(f.symbol) + '</span>' : '') + '</label>' +
      '<div class="input-group"><input id="' + fid + '" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" enterkeyhint="done" data-num="' + f.id +
      '" value="' + esc(st.values[f.id] || '') + '" placeholder="' + esc(f.placeholder || (f.optional ? 'opcional' : 'Digite o valor')) + '" aria-describedby="' + desc + '">' + unitPart + '</div>' +
      (f.hint ? '<p class="hint" id="h-' + f.id + '">' + esc(f.hint) + '</p>' : '') +
      '<p class="err" id="e-' + f.id + '"></p></div>';
  }

  function listHtml(calc, st) {
    var n = st.list.length;
    var rows = st.list.map(function (r, i) {
      var name = 'R' + (i + 1);
      return '<li class="rrow" data-row="' + i + '"><label for="r-' + i + '">' + name + '</label>' +
        '<div class="input-group"><input id="r-' + i + '" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" data-li="' + i + '" value="' + esc(r.value) +
        '" placeholder="Valor de ' + name + '" aria-describedby="e-list-' + i + '">' +
        '<select data-lu="' + i + '" aria-label="Unidade de ' + name + '">' + unitOptions(U.unitSymbols('resistance'), r.unit) + '</select></div>' +
        '<button type="button" class="icon-btn" data-remove="' + i + '" aria-label="Remover ' + name + '"' + (n <= calc.minItems ? ' disabled' : '') + '>' + icon('x') + '</button>' +
        '<p class="err" id="e-list-' + i + '"></p></li>';
    }).join('');
    return '<div class="field" data-field="list"><div class="list-meta">Resistores cadastrados <span>' + n + ' de ' + calc.maxItems + '</span></div>' +
      '<ol class="rlist">' + rows + '</ol>' +
      '<button type="button" class="btn btn-ghost btn-small" data-act="add"' + (n >= calc.maxItems ? ' disabled' : '') + '>' + icon('plus', 'ico-sm') + 'Adicionar resistor</button>' +
      '<p class="err" id="e-list"></p></div>';
  }

  function renderFields(calc, st) {
    var box = document.getElementById('fields');
    var h = calc.fields.map(function (f) { return fieldHtml(calc, f, st); }).join('');
    if (calc.hasList) h += listHtml(calc, st);
    box.innerHTML = h;
    applyLocks(calc, st);
  }

  function updateVisibility(calc, st) {
    calc.fields.forEach(function (f) {
      var el = document.querySelector('[data-field="' + f.id + '"]');
      if (el) el.hidden = !C.isVisible(f, st);
    });
  }

  /* Carga resistiva ideal: FP fica travado em 1. */
  function applyLocks(calc, st) {
    if (!st.values.hasOwnProperty('nature')) return;
    var input = document.getElementById('f-FP');
    var hint = document.getElementById('h-FP');
    if (!input) return;
    var lock = st.values.nature === 'resistiva';
    if (lock) {
      st.values.FP = '1';
      input.value = '1';
    }
    input.readOnly = lock;
    if (hint) hint.textContent = lock ? 'Carga resistiva ideal: o fator de potência é sempre 1.' : 'Número entre 0 e 1. Ex.: 0,8';
  }

  function allEmpty(calc, st) {
    var numbers = calc.fields.filter(function (f) { return f.type === 'number' && C.isVisible(f, st); });
    var e = numbers.every(function (f) { return !String(st.values[f.id] || '').trim(); });
    if (calc.hasList) e = e && st.list.every(function (r) { return !String(r.value || '').trim(); });
    return e;
  }

  function clearFieldErrors() {
    Array.prototype.forEach.call($main.querySelectorAll('.err'), function (el) { el.textContent = ''; });
    Array.prototype.forEach.call($main.querySelectorAll('.invalid'), function (el) { el.classList.remove('invalid'); });
    Array.prototype.forEach.call($main.querySelectorAll('[aria-invalid]'), function (el) { el.removeAttribute('aria-invalid'); });
  }

  function showFieldErrors(fieldErrors) {
    clearFieldErrors();
    Object.keys(fieldErrors || {}).forEach(function (k) {
      var msg = fieldErrors[k];
      var m = /^list\.(\d+)$/.exec(k);
      var errEl, wrap, input;
      if (m) {
        errEl = document.getElementById('e-list-' + m[1]);
        wrap = document.querySelector('.rrow[data-row="' + m[1] + '"]');
        input = document.getElementById('r-' + m[1]);
      } else {
        errEl = document.getElementById('e-' + k);
        wrap = document.querySelector('[data-field="' + k + '"]');
        input = document.getElementById('f-' + k);
      }
      if (errEl) errEl.textContent = msg;
      if (wrap) wrap.classList.add('invalid');
      if (input) input.setAttribute('aria-invalid', 'true');
    });
  }

  /* ------------------------------------------------------------ */
  /* Calculadora: resultado, memória e explicação                  */
  /* ------------------------------------------------------------ */
  function emptyResult() {
    return '<div class="res-empty">' + icon('calc') + '<p><strong style="color:var(--navy)">Pronto para calcular</strong></p>' +
      '<p>Preencha os dados e toque em <b>Calcular</b>. Se preferir, use <b>Carregar exemplo</b> para ver um caso resolvido.</p></div>';
  }

  function staticExplain(calc, res) {
    var h = '';
    if (res && res.ok) {
      h += res.explanation.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
    } else {
      h += '<p class="muted-box">' + esc(calc.objective) + ' A explicação do seu resultado aparece aqui depois do cálculo.</p>';
    }
    h += '<h3>Fórmulas desta calculadora</h3><div class="formula-chips">' + calc.formulas.map(function (f) { return '<code>' + esc(f) + '</code>'; }).join('') + '</div>';
    h += '<h3>Hipóteses e limitações</h3><ul>' + calc.assumptions.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul>';
    h += '<p class="note-edu">' + icon('info', 'ico-sm') + '<span>' + esc(R.DISCLAIMER) + '</span></p>';
    return h;
  }

  function stepHtml(s) {
    var h = '<li class="step"><h3>' + esc(s.title) + '</h3>';
    if (s.lines) h += '<ul class="f-lines">' + s.lines.map(function (l) { return '<li class="f">' + esc(l) + '</li>'; }).join('') + '</ul>';
    if (s.formula) h += '<div class="f-row"><span class="f-tag">Fórmula</span><span class="f">' + esc(s.formula) + '</span></div>';
    if (s.subst) h += '<div class="f-row"><span class="f-tag">Substituição</span><span class="f">' + esc(s.subst) + '</span></div>';
    if (s.result) h += '<div class="f-row"><span class="f-tag">Resultado</span><span class="f f-res">' + esc(s.result) + '</span></div>';
    return h + '</li>';
  }

  function itemRow(it) {
    return '<div class="res-row"><dt>' + esc(it.label) + (it.symbol ? '<span class="sym">' + esc(it.symbol) + '</span>' : '') + '</dt><dd>' + esc(it.text) +
      (it.base ? '<small>' + esc(it.base) + '</small>' : '') + '</dd></div>';
  }

  function diagramHtml(res) {
    var dg = DG.render(res.diagram);
    if (!dg) return '';
    var title = res.diagram.title || 'Esquema simplificado';
    return '<figure class="diagram" style="margin-left:0;margin-right:0"><h3>' + esc(title) + '</h3>' + dg.svg +
      (dg.legend.length ? '<ul class="dg-legend">' + dg.legend.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>' : '') + '</figure>';
  }

  function renderOutput(calc, res, isLive) {
    var body = document.getElementById('resultBody');
    var memo = document.getElementById('memoBody');
    var exp = document.getElementById('explainBody');
    var live = document.getElementById('liveTag');
    if (!body) return;
    if (live) live.hidden = !isLive;
    if (!res) {
      body.innerHTML = emptyResult();
      memo.innerHTML = '<p class="muted-box">Depois do cálculo, você verá aqui a fórmula geral, a substituição dos números, a operação e o resultado final de cada etapa.</p>';
      exp.innerHTML = staticExplain(calc, null);
      return;
    }
    if (!res.ok) {
      body.innerHTML = '<div class="res-error" role="alert"><strong>' + icon('alert') + 'Confira os dados</strong><ul>' +
        res.errors.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>';
      memo.innerHTML = '<p class="muted-box">Corrija os dados indicados para ver a memória de cálculo.</p>';
      exp.innerHTML = staticExplain(calc, null);
      return;
    }
    var h = '<div class="res-primary">' + res.primary.map(function (it) {
      return '<div class="res-main"><span class="res-label">' + icon('check', 'ico-sm') + esc(it.label) + (it.symbol ? ' <span class="sym">' + esc(it.symbol) + '</span>' : '') + '</span>' +
        '<strong class="res-value" data-result="' + esc(it.symbol || it.label) + '">' + esc(it.text) + '</strong>' + (it.base ? '<span class="res-base">= ' + esc(it.base) + '</span>' : '') + '</div>';
    }).join('') + '</div>';
    if (res.equation) h += '<p class="equation" data-equation>' + esc(res.equation) + '</p>';
    if (res.results.length) h += '<div class="res-sub"><h3>' + esc(res.resultsTitle) + '</h3><dl class="res-list">' + res.results.map(itemRow).join('') + '</dl></div>';
    if (res.warnings.length) h += '<div class="alerts">' + res.warnings.map(function (w) { return '<p class="alert">' + icon('alert', 'ico-sm') + '<span>' + esc(w) + '</span></p>'; }).join('') + '</div>';
    h += diagramHtml(res);
    h += '<div class="res-actions">' +
      '<button type="button" class="btn btn-ghost btn-small" data-act="copy-result">' + icon('copy', 'ico-sm') + 'Copiar resultado</button>' +
      '<button type="button" class="btn btn-ghost btn-small" data-act="copy-full">' + icon('file', 'ico-sm') + 'Copiar resolução</button>' +
      '<button type="button" class="btn btn-ghost btn-small" data-act="print">' + icon('printer', 'ico-sm') + 'Imprimir ou salvar PDF</button>' +
      '<button type="button" class="btn btn-ghost btn-small" data-act="new">' + icon('refresh', 'ico-sm') + 'Fazer novo cálculo</button></div>';
    body.innerHTML = h;

    var m = '<h3 class="kicker" style="margin-bottom:8px">Dados utilizados</h3><div class="inputs-used">' + res.inputs.map(function (i) {
      return '<span class="pill"><b>' + esc(i.symbol || i.label) + '</b> ' + esc(i.text) + (i.si ? ' <small>(' + esc(i.si) + ')</small>' : '') + '</span>';
    }).join('') + '</div><ol class="steps">' + res.steps.map(stepHtml).join('') + '</ol>';
    memo.innerHTML = m;
    exp.innerHTML = staticExplain(calc, res);
  }

  /* ------------------------------------------------------------ */
  /* Calculadora: execução                                         */
  /* ------------------------------------------------------------ */
  function compute(id, mode) {
    var calc = C.BY_ID[id];
    var st = getState(id);
    if ((calc.live || mode !== 'explicit') && allEmpty(calc, st)) {
      app.last[id] = null;
      clearFieldErrors();
      renderOutput(calc, null, !!calc.live);
      return null;
    }
    var res = C.run(id, st, { precision: app.precision });
    app.last[id] = res;
    showFieldErrors(res.ok ? {} : res.fieldErrors);
    renderOutput(calc, res, app.auto[id] || !!calc.live);
    if (res.ok) {
      if (mode === 'explicit') saveHistory(id, st, res);
      else if (mode === 'auto') scheduleHistory(id);
    }
    return res;
  }

  function scheduleCompute(id) {
    clearTimeout(app.timers.compute);
    app.timers.compute = setTimeout(function () { if (app.route && app.route.id === id) compute(id, 'auto'); }, 140);
  }

  function onEdit(id) {
    var calc = C.BY_ID[id];
    if (app.auto[id] || calc.live) scheduleCompute(id);
  }

  /* ------------------------------------------------------------ */
  /* Histórico                                                     */
  /* ------------------------------------------------------------ */
  function persistHistory() { store.set(KEYS.history, app.history); }

  function saveHistory(id, st, res) {
    var sig = JSON.stringify(st);
    var top = app.history[0];
    if (top && top.calcId === id && top.sig === sig) {
      top.ts = Date.now();
      top.result = R.resultSummary(res);
    } else {
      app.history.unshift({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        calcId: id, ts: Date.now(), state: clone(st), sig: sig,
        inputs: R.inputsSummary(res), result: R.resultSummary(res)
      });
    }
    app.history = app.history.slice(0, HISTORY_MAX);
    persistHistory();
  }

  function scheduleHistory(id) {
    clearTimeout(app.timers.hist);
    app.timers.hist = setTimeout(function () {
      var res = app.last[id];
      if (res && res.ok && app.route && app.route.id === id) saveHistory(id, getState(id), res);
    }, 2500);
  }

  function renderHistory() {
    var h = '<div class="wrap"><div class="page-head"><div><h1 id="page-title" tabindex="-1">Histórico de cálculos</h1>' +
      '<p>Os últimos ' + HISTORY_MAX + ' cálculos ficam guardados neste navegador.</p></div>' +
      (app.history.length ? '<button type="button" class="btn btn-ghost" data-act="hist-clear">' + icon('trash', 'ico-sm') + '<span>Limpar histórico</span></button>' : '') + '</div>';
    if (!store.available) {
      h += '<div class="notice">O armazenamento deste navegador está indisponível (por exemplo, em janela anônima ou com dados bloqueados). O histórico funciona apenas enquanto esta página estiver aberta.</div>';
    }
    if (!app.history.length) {
      h += '<div class="card empty-search">Nenhum cálculo no histórico ainda. Ao calcular, o resultado aparece aqui.</div>';
    } else {
      h += '<ul class="hist-list">' + app.history.map(function (r) {
        var c = C.BY_ID[r.calcId];
        return '<li class="card hist-item"><div><p class="hist-meta">' + esc(R.formatDate(new Date(r.ts))) + '</p><h3>' + esc(c.name) + '</h3>' +
          '<p class="hist-data">' + esc(r.inputs) + '</p><p class="hist-res">' + esc(r.result) + '</p></div>' +
          '<div class="hist-actions"><button type="button" class="btn btn-soft btn-small" data-reopen="' + r.id + '">Reabrir</button>' +
          '<button type="button" class="btn btn-ghost btn-small" data-del="' + r.id + '" aria-label="Excluir registro de ' + esc(c.name) + '">' + icon('trash', 'ico-sm') + '</button></div></li>';
      }).join('') + '</ul>';
    }
    h += footer() + '</div>';
    $main.innerHTML = h;
  }

  /* ------------------------------------------------------------ */
  /* Página da calculadora                                         */
  /* ------------------------------------------------------------ */
  function renderCalc(id) {
    var calc = C.BY_ID[id];
    var cat = catOf(calc);
    var st = getState(id);
    if (calc.live) app.auto[id] = true;
    $main.innerHTML = '<div class="wrap">' +
      '<nav class="crumbs" aria-label="Navegação"><a href="#/">' + icon('back', 'ico-sm') + 'Todas as calculadoras</a></nav>' +
      '<section class="card calc-head" aria-labelledby="calc-title"><span class="tool-icon cat-' + calc.category + '">' + icon(calc.icon) + '</span>' +
      '<div class="head-text"><p class="kicker">Calculadora ' + pad2(calc.num) + ' | ' + esc(cat.name) + '</p>' +
      '<h1 id="calc-title" tabindex="-1">' + esc(calc.name) + '</h1><p class="objective">' + esc(calc.objective) + '</p><p class="guidance">' + esc(calc.guidance) + '</p></div>' +
      starButton(calc) + '</section>' +
      '<div class="calc-grid">' +
      '<form class="card inputs-card" id="calcForm" novalidate aria-labelledby="in-title"><h2 class="section-title" id="in-title">' + icon('calc') + 'Dados de entrada</h2>' +
      '<div id="fields"></div>' +
      '<div class="form-actions"><button class="btn btn-primary" type="submit">' + icon('check') + 'Calcular</button>' +
      '<button type="button" class="btn btn-ghost" data-act="example">' + icon('book', 'ico-sm') + 'Carregar exemplo</button>' +
      '<button type="button" class="btn btn-ghost" data-act="clear">' + icon('eraser', 'ico-sm') + 'Limpar</button></div></form>' +
      '<section class="card result-card" id="resultCard" aria-labelledby="res-title"><div class="result-head"><h2 class="section-title" id="res-title">' + icon('check') + 'Resultado</h2>' +
      '<span class="live" id="liveTag" hidden>Atualização automática</span></div><div id="resultBody" aria-live="polite"></div></section></div>' +
      '<div class="lower"><section class="card card-pad" aria-labelledby="memo-title"><h2 class="section-title" id="memo-title">' + icon('file') + 'Memória de cálculo</h2><div id="memoBody"></div></section>' +
      '<section class="card card-pad explain" aria-labelledby="exp-title"><h2 class="section-title" id="exp-title">' + icon('book') + 'Explicação</h2><div id="explainBody"></div></section></div>' +
      footer() + '</div>';

      compute(id, 'refresh');

      compute(id, 'refresh');
    } else {
      renderOutput(calc, null, !!calc.live);
    }
  }

  function loadExample(id) {
    var calc = C.BY_ID[id];
    app.states[id] = C.exampleState(calc);
    app.auto[id] = true;
    renderFields(calc, app.states[id]);
    compute(id, 'example');
    toast('Exemplo carregado e calculado.');
  }

  function clearCalc(id, focus) {
    var calc = C.BY_ID[id];
    app.states[id] = C.defaultState(calc);
    app.auto[id] = !!calc.live;
    app.last[id] = null;
    clearTimeout(app.timers.hist);
    renderFields(calc, app.states[id]);
    clearFieldErrors();
    renderOutput(calc, null, !!calc.live);
    if (focus) {
      var first = document.querySelector('#fields input[type="text"]:not([readonly])');
      var top = document.getElementById('calcForm');
      if (top && top.getBoundingClientRect().top < 0) top.scrollIntoView({ block: 'start' });
      if (first) first.focus({ preventScroll: true });
    }
  }

  function focusFirstInvalid() {
    var el = $main.querySelector('[aria-invalid="true"]');
    if (el) el.focus();
  }

  /* ------------------------------------------------------------ */
  /* Impressão / PDF                                               */
  /* ------------------------------------------------------------ */
  function buildPrint(calc, res) {
    var dg = DG.render(res.diagram);
    var h = '<div class="p-head"><div><strong>' + esc(R.PRODUCT) + '</strong><br><span>Kit de Calculadoras Elétricas Automáticas</span></div><div>' + esc(R.formatDate(new Date())) + '</div></div>';
    h += '<h1>' + esc(calc.name) + '</h1><p>' + esc(calc.objective) + '</p>';
    h += '<h2>Dados de entrada</h2><table>' + res.inputs.map(function (i) {
      return '<tr><td>' + esc(i.label) + (i.symbol ? ' (' + esc(i.symbol) + ')' : '') + '</td><td class="v">' + esc(i.text) + (i.si ? ' = ' + esc(i.si) : '') + '</td></tr>';
    }).join('') + '</table>';
    h += '<h2>Resultados</h2><table>' + (res.equation ? '<tr><td colspan="2"><b>' + esc(res.equation) + '</b></td></tr>' : '') +
      res.primary.concat(res.results).map(function (it) {
        return '<tr><td>' + esc(it.label) + (it.symbol ? ' (' + esc(it.symbol) + ')' : '') + '</td><td class="v">' + esc(it.text) + (it.base ? ' = ' + esc(it.base) : '') + '</td></tr>';
      }).join('') + '</table>';
    if (res.warnings.length) h += '<h2>Avisos</h2><ul>' + res.warnings.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul>';
    if (dg) h += '<div class="p-diagram">' + dg.svg + '</div>' + (dg.legend.length ? '<p>' + dg.legend.map(esc).join(' | ') + '</p>' : '');
    h += '<h2>Memória de cálculo</h2>' + res.steps.map(function (s, i) {
      var t = '<div class="p-step"><b>' + (i + 1) + '. ' + esc(s.title) + '</b><br>';
      if (s.lines) t += s.lines.map(function (l) { return '<code>' + esc(l) + '</code>'; }).join('<br>') + '<br>';
      if (s.formula) t += 'Fórmula: <code>' + esc(s.formula) + '</code><br>';
      if (s.subst) t += 'Substituição: <code>' + esc(s.subst) + '</code><br>';
      if (s.result) t += 'Resultado: <code><b>' + esc(s.result) + '</b></code>';
      return t + '</div>';
    }).join('');
    h += '<h2>Explicação</h2>' + res.explanation.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
    h += '<h2>Hipóteses e limitações</h2><ul>' + res.assumptions.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul>';
    h += '<p class="p-disc">' + esc(R.DISCLAIMER) + '</p>';
    return h;
  }

  function printResult(id) {
    var res = app.last[id];
    if (!res || !res.ok) { toast('Calcule primeiro para imprimir o resultado.'); return; }
    $print.innerHTML = buildPrint(C.BY_ID[id], res);
    window.print();
  }

  /* ------------------------------------------------------------ */
  /* Favoritos                                                     */
  /* ------------------------------------------------------------ */
  function toggleFav(id) {
    var i = app.favorites.indexOf(id);
    if (i >= 0) app.favorites.splice(i, 1); else app.favorites.push(id);
    var saved = store.set(KEYS.fav, app.favorites);
    var on = isFav(id);
    var name = C.BY_ID[id].name;
    Array.prototype.forEach.call(document.querySelectorAll('[data-fav="' + id + '"]'), function (b) {
      b.setAttribute('aria-pressed', String(on));
      b.setAttribute('aria-label', (on ? 'Remover ' : 'Adicionar ') + name + (on ? ' das favoritas' : ' às favoritas'));
    });
    renderSidebar();
    if (app.route.view === 'home' && app.filter === 'fav') renderCards();
    toast(on ? (saved ? 'Adicionada às favoritas.' : 'Adicionada às favoritas (válido só nesta sessão).') : 'Removida das favoritas.');
  }

  /* ------------------------------------------------------------ */
  /* Eventos                                                       */
  /* ------------------------------------------------------------ */
  function currentCalcId() { return app.route && app.route.view === 'calc' ? app.route.id : null; }

  $main.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'search') {
      app.query = t.value;
      renderCards();
      return;
    }
    var id = currentCalcId();
    if (!id) return;
    var st = getState(id);
    if (t.hasAttribute('data-num')) { st.values[t.getAttribute('data-num')] = t.value; onEdit(id); }
    else if (t.hasAttribute('data-li')) { st.list[+t.getAttribute('data-li')].value = t.value; onEdit(id); }
  });

  $main.addEventListener('change', function (e) {
    var t = e.target;
    var id = currentCalcId();
    if (!id) return;
    var calc = C.BY_ID[id];
    var st = getState(id);
    if (t.hasAttribute('data-unit')) { st.units[t.getAttribute('data-unit')] = t.value; onEdit(id); }
    else if (t.hasAttribute('data-lu')) { st.list[+t.getAttribute('data-lu')].unit = t.value; onEdit(id); }
    else if (t.hasAttribute('data-unitpick')) {
      st.values[t.getAttribute('data-unitpick')] = t.value;
      var echo = $main.querySelector('[data-unit-echo]');
      if (echo) echo.textContent = st.values.from || '';
      onEdit(id);
    } else if (t.hasAttribute('data-choice')) {
      var fid = t.getAttribute('data-choice');
      st.values[fid] = t.value;
      if (calc.fields.some(function (f) { return f.type === 'unitpick' && f.dimFrom === fid; })) {
        calc.fields.forEach(function (f) { if (f.type === 'unitpick') st.values[f.id] = C.unitpickDefault(f, st.values[fid]); });
        renderFields(calc, st);
        var sel = document.getElementById('f-' + fid);
        if (sel) sel.focus();
      } else {
        updateVisibility(calc, st);
        applyLocks(calc, st);
      }
      onEdit(id);
    }
  });

  $main.addEventListener('submit', function (e) {
    e.preventDefault();
    var id = currentCalcId();
    if (!id) return;
    app.auto[id] = true;
    clearTimeout(app.timers.compute);
    var res = compute(id, 'explicit');
    if (res && !res.ok) { focusFirstInvalid(); return; }
    var card = document.getElementById('resultCard');
    if (card && window.innerWidth < 1100) {
      var top = card.getBoundingClientRect().top;
      if (top > window.innerHeight * 0.6 || top < 0) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });

  $main.addEventListener('click', function (e) {
    var t = e.target.closest('button, a');
    if (!t) return;
    if (t.hasAttribute('data-fav')) { toggleFav(t.getAttribute('data-fav')); return; }
    if (t.hasAttribute('data-filter')) {
      app.filter = t.getAttribute('data-filter');
      renderChips();
      renderCards();
      return;
    }
    if (t.hasAttribute('data-reopen')) {
      var rec = app.history.filter(function (r) { return r.id === t.getAttribute('data-reopen'); })[0];
      if (rec) {
        app.states[rec.calcId] = clone(rec.state);
        app.auto[rec.calcId] = true;
        app.pendingCompute = rec.calcId;
        location.hash = '#/calc/' + rec.calcId;
      }
      return;
    }
    if (t.hasAttribute('data-del')) {
      var delId = t.getAttribute('data-del');
      app.history = app.history.filter(function (r) { return r.id !== delId; });
      persistHistory();
      renderHistory();
      toast('Registro excluído.');
      return;
    }
    var act = t.getAttribute('data-act');
    if (!act) return;
    if (act === 'hist-clear') {
      if (t.getAttribute('data-confirm') === '1') {
        app.history = [];
        persistHistory();
        renderHistory();
        toast('Histórico apagado.');
      } else {
        t.setAttribute('data-confirm', '1');
        t.querySelector('span').textContent = 'Toque de novo para confirmar';
        setTimeout(function () {
          if (document.body.contains(t)) { t.removeAttribute('data-confirm'); t.querySelector('span').textContent = 'Limpar histórico'; }
        }, 4000);
      }
      return;
    }
    var id = currentCalcId();
    if (!id) return;
    var calc = C.BY_ID[id];
    var st = getState(id);
    if (act === 'example') loadExample(id);
    else if (act === 'clear') clearCalc(id, true);
    else if (act === 'new') clearCalc(id, true);
    else if (act === 'add') {
      if (st.list.length < calc.maxItems) {
        st.list.push({ value: '', unit: U.OHM });
        renderFields(calc, st);
        var inp = document.getElementById('r-' + (st.list.length - 1));
        if (inp) inp.focus();
        onEdit(id);
      }
    } else if (act === 'swap') {
      var tmp = st.values.from;
      st.values.from = st.values.to;
      st.values.to = tmp;
      renderFields(calc, st);
      onEdit(id);
    } else if (act === 'copy-result' || act === 'copy-full') {
      var res = app.last[id];
      if (!res || !res.ok) return;
      if (act === 'copy-result') copyText(R.resultText(res), 'Resultado copiado.');
      else copyText(R.reportText(res, new Date()), 'Resolução completa copiada.');
    } else if (act === 'print') printResult(id);
  });

  $main.addEventListener('click', function (e) {
    var t = e.target.closest('[data-remove]');
    if (!t) return;
    var id = currentCalcId();
    var calc = C.BY_ID[id];
    var st = getState(id);
    if (st.list.length <= calc.minItems) return;
    st.list.splice(+t.getAttribute('data-remove'), 1);
    renderFields(calc, st);
    onEdit(id);
  });

  $prec.value = String(app.precision);
  $prec.addEventListener('change', function () {
    app.precision = +$prec.value;
    store.set(KEYS.prec, app.precision);
    var id = currentCalcId();
    if (id && app.last[id]) compute(id, 'refresh');
    toast('Resultados com ' + app.precision + ' casas decimais.');
  });

  /* ------------------------------------------------------------ */
  /* Rotas                                                         */
  /* ------------------------------------------------------------ */
  function parseRoute() {
    var h = location.hash.replace(/^#\/?/, '');
    var parts = h.split('/');
    if (parts[0] === 'calc' && C.BY_ID[parts[1]]) return { view: 'calc', id: parts[1] };
    if (parts[0] === 'historico') return { view: 'history' };
    if (parts[0] === 'sobre') return { view: 'about' };
    return { view: 'home' };
  }

  var firstRender = true;
  function route() {
    var r = parseRoute();
    app.route = r;
    closeMenu();
    clearTimeout(app.timers.compute);
    if (r.view === 'calc') renderCalc(r.id);
    else if (r.view === 'history') renderHistory();
    else if (r.view === 'about') renderAbout();
    else renderHome();
    renderSidebar();
    var titles = { home: 'MapaElétrica Calc', history: 'Histórico | MapaElétrica Calc', about: 'Como usar | MapaElétrica Calc' };
    document.title = r.view === 'calc' ? C.BY_ID[r.id].name + ' | MapaElétrica Calc' : titles[r.view];
    if (!firstRender) {
      window.scrollTo(0, 0);
      var h1 = $main.querySelector('h1');
      if (h1) h1.focus({ preventScroll: true });
    }
    firstRender = false;
  }

  window.addEventListener('hashchange', route);
  route();

  /* Exposto para testes automatizados. Não é usado pela interface. */
  window.MEC.app = { state: app, store: store, version: VERSION };
})();

</script>
</body>
</html>
